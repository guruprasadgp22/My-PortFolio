# Netlify build settings (Vite static site)
[build]
  command = "npm run build"
  publish = "dist"

  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Built files have a content hash in their names, so browsers can keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must always be re-checked, so a new deploy reaches everyone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The site editor's pages: never in search results (the page also adds a noindex meta tag).
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The site editor's own pages (/admin/login, /admin) are part of the same app: serve index.html for them.
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

# Java backend (backend/, Spring Boot microservices). Once it's running on its own server (see backend/README.md):
#   1. delete the netlify/functions folder (the Node API it replaces)
#   2. uncomment this, with your API domain, and push. The site keeps calling /api/... on its own address,
#      so the admin cookie stays first-party and no CORS is needed.
# [[redirects]]
#   from = "/api/*"
#   to = "https://api.example.com/api/:splat"
#   status = 200
#   force = true

