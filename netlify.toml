# Netlify build settings (Vite static site)
[build]
  command = "npm run build"
  publish = "dist"

  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Built files have a content hash in their names, so browsers can keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must always be re-checked, so a new deploy reaches everyone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
