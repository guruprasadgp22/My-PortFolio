# Render blueprint: the Java backend (backend/) as one free web service.
# Render → New → Blueprint → pick this repo. It asks for the values marked sync: false.
services:
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    # only rebuild when the backend changes, not on every site edit
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: portfolio
      - key: YOUTUBE_API_KEY
        sync: false
      # made by Render, never shown in the repo
      - key: SESSION_SECRET
        generateValue: true
      - key: INTERNAL_TOKEN
        generateValue: true
      # who may send changes: the live site, its deploy previews, and local `npm run dev:java`
      - key: ALLOWED_ORIGINS
        value: ^https://([a-z0-9-]+--)?guruprasadgp\.netlify\.app$|^http://localhost:5173$
      - key: CLIENT_IP_HEADER
        value: X-Nf-Client-Connection-Ip
