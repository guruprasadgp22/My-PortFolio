    <script>
      // Apply the saved (or system) theme before first paint so the page never flashes the wrong one.
      (function () {
        var t;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        // play the short intro (components/Intro.jsx) on every page load, unless the device asks for reduced motion
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("intro");
        // part of the visitor's day, for the background glow: morning, day, evening or night
        var h = new Date().getHours();
        document.documentElement.dataset.daypart = h < 5 || h >= 21 ? "night" : h < 11 ? "morning" : h < 17 ? "day" : "evening";
      })();
    </script>
