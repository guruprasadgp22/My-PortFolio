# Performance guard: builds the site and runs Lighthouse on every push and pull request.
# The check fails if performance, accessibility, best practices or SEO drop below the budgets in
# lighthouserc.json, so a new feature can't quietly slow the site down.
name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run Lighthouse
        run: npx --yes @lhci/cli@0.14.0 autorun
