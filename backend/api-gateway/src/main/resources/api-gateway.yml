spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 60s
          # the services' own security headers win over nothing: the gateway adds them on the way out
          default-filters:
            - RemoveResponseHeader=Server
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/admin/login,/api/admin/logout,/api/admin/me,/api/admin/password
            - id: content-service
              uri: lb://content-service
              predicates:
                - Path=/api/content,/api/admin/data,/api/admin/sections/**
            - id: learning-service
              uri: lb://learning-service
              predicates:
                - Path=/api/playlists,/api/admin/learning,/api/admin/learning/**
            - id: coding-service
              uri: lb://coding-service
              predicates:
                - Path=/api/stats,/api/admin/coding/**
            - id: contest-service
              uri: lb://contest-service
              predicates:
                - Path=/api/admin/contests,/api/admin/contests/**
            - id: media-service
              uri: lb://media-service
              predicates:
                - Path=/api/img/**,/api/admin/images,/api/admin/images/**
            - id: chat-service
              uri: lb://chat-service
              predicates:
                - Path=/api/chat

server:
  port: ${PORT:8080}
  server-header: ""
  error:
    include-message: never
    include-stacktrace: never

portfolio:
  session-secret: ${SESSION_SECRET:}
  internal-token: ${INTERNAL_TOKEN:}
  # who may send writes: the live site and its Netlify deploy previews (add http://localhost:5173 for local runs)
  allowed-origins: ${ALLOWED_ORIGINS:^https://([a-z0-9-]+--)?guruprasadgp\.netlify\.app$}
  # Netlify passes the visitor's real address in this header
  client-ip-header: ${CLIENT_IP_HEADER:X-Nf-Client-Connection-Ip}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
